providers = ["node"]

# ใช้ pnpm ผ่าน npx แทน global install
# (npm install -g บน Nix ไม่ได้เพิ่ม bin เข้า PATH -> "pnpm: command not found")
# และไม่ใช้ corepack ของ Nixpacks (0.24.1 หา pnpm v12 ไม่เจอ -> MODULE_NOT_FOUND)

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npx --yes pnpm@12.3.4 install --frozen-lockfile"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
